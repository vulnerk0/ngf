         html, body {
             height: 100%;
             margin: 0;
             padding: 0;
             overflow: hidden;
         }

         body {
             display: flex;
             flex-direction: column;
         }

         #mynetwork {
             /* pyvis injects width/height — override both so it fills flex parent */
             width: 100% !important;
             height: 100% !important;
             background-color: #343a40;
             border: none;
             position: relative;
             flex: 1 1 auto;
             min-width: 0;
         }

         

         

         /* ── Layout ── */
         #page-wrapper {
             display: flex;
             align-items: stretch;
             flex: 1 1 auto;
             min-height: 0;
             overflow: hidden;
         }

         #host-sidebar {
             width: 600px;
             min-width: 200px;
             max-width: 80vw;
             background: #272b30;
             display: flex;
             flex-direction: column;
             overflow: hidden;
             font-family: 'Segoe UI', system-ui, sans-serif;
             flex-shrink: 0;
         }

         /* ── Drag-to-resize handle ── */
         #sidebar-resizer {
             width: 5px;
             min-width: 5px;
             background: #495057;
             cursor: col-resize;
             flex-shrink: 0;
             position: relative;
             transition: background .15s;
             z-index: 10;
         }

         #sidebar-resizer:hover,
         #sidebar-resizer.dragging {
             background: #f0b429;
         }

         #sidebar-resizer::after {
             content: '';
             position: absolute;
             top: 50%;
             left: 50%;
             transform: translate(-50%, -50%);
             width: 1px;
             height: 32px;
             background: rgba(255,255,255,.18);
             border-radius: 1px;
         }

         #sidebar-header {
             padding: 14px 16px;
             background: #272b30;
             border-bottom: 1px solid #495057;
             font-size: 13px;
             font-weight: 600;
             color: #a0a8c0;
             letter-spacing: .06em;
             text-transform: uppercase;
             display: flex;
             align-items: center;
             gap: 8px;
         }

         #sidebar-header svg { flex-shrink: 0; }

         #host-list {
             overflow-y: auto;
             flex: 1;
             padding: 8px;
             display: flex;
             flex-direction: column;
             gap: 6px;
         }

         #host-list::-webkit-scrollbar { width: 5px; }
         #host-list::-webkit-scrollbar-track { background: transparent; }
         #host-list::-webkit-scrollbar-thumb { background: #495057; border-radius: 3px; }

         .host-btn {
             width: 100%;
             background: #2b3035;
             border: 1px solid #495057;
             padding: 10px 12px;
             cursor: pointer;
             text-align: left;
             color: #c8d0e8;
             transition: background .15s, border-color .15s;
         }

         .host-btn:hover { background: #3f464d; border-color: #6c757d; }
         .host-btn.active { background: #495057; border-color: #adb5bd; }

         .host-btn .hb-ip {
             font-size: 11px;
             color: #adb5bd;
             font-weight: 700;
             font-family: 'Cascadia Code', 'Fira Code', monospace;
         }

         .host-btn .hb-hostname {
             font-size: 17px;
             color: #f8f9fa;
             margin-top: 2px;
             white-space: nowrap;
             overflow: hidden;
             text-overflow: ellipsis;
         }

         .host-btn .hb-meta {
             display: flex;
             gap: 10px;
             margin-top: 6px;
         }

         .hb-badge {
             font-size: 13px;
             padding: 2px 7px;
             font-weight: 600;
             background: #495057;
             color: #dee2e6;
         }

         .hb-badge.os  { background: #4d453f; color: #ced4da; }
         .hb-badge.ports { background: #495057; color: #f8f9fa; }

         /* ── Detail Panel ── */
         #host-detail {
             display: none;
             border-top: 1px solid #495057;
             background: #2b3035;
             flex-direction: column;
             flex: 1 1 auto;
             min-height: 0;
             overflow: hidden;
         }

         #detail-header {
             padding: 10px 14px;
             display: flex;
             align-items: center;
             justify-content: space-between;
             background: #2b3035;
             border-bottom: 1px solid #495057;
         }

         #detail-header .dh-ip {
             font-family: monospace;
             font-size: 14px;
             font-weight: 700;
             color: #f8f9fa;
         }

         #detail-close {
             background: none;
             border: 1px solid #495057;
             color: #adb5bd;
             cursor: pointer;
             font-size: 14px;
             padding: 3px 8px;
         }

         #detail-close:hover { color: #f8f9fa; border-color: #adb5bd; }

         #detail-body {
             overflow-y: auto;
             overflow-x: auto;
             padding: 10px;
             flex: 1;
         }

         #detail-body::-webkit-scrollbar { width: 5px; height: 5px; }
         #detail-body::-webkit-scrollbar-track { background: transparent; }
         #detail-body::-webkit-scrollbar-thumb { background: #495057; border-radius: 3px; }

         /* ── nmap-xslt style port table ── */
         .port-table {
             /* auto layout: every column sizes to its content */
             width: auto;
             min-width: 100%;
             border-collapse: collapse;
             font-size: 12px;
             margin-bottom: 10px;
             table-layout: auto;
             white-space: nowrap;   /* keep each cell on one line; body scrolls if needed */
         }

         .port-table thead tr {
             background: #23272b;
             color: #adb5bd;
             font-size: 11px;
             font-weight: 700;
             text-transform: uppercase;
             letter-spacing: .05em;
         }

         .port-table thead th {
             padding: 6px 10px;
             border: 1px solid #495057;
             white-space: nowrap;
         }

         .port-table tbody tr.pt-port-row {
             border-bottom: 1px solid #495057;
             transition: background .12s;
         }

         .port-table tbody tr.pt-port-row:hover { background: #3d444b; }

         .port-table tbody tr.pt-port-row.state-open    { background: #1a2e1a; }
         .port-table tbody tr.pt-port-row.state-open:hover { background: #22381e; }
         .port-table tbody tr.pt-port-row.state-closed   { background: #2e1a1a; }
         .port-table tbody tr.pt-port-row.state-filtered { background: #2e2a14; }

         .port-table td {
             padding: 5px 10px;
             border-right: 1px solid #3a4049;
             color: #dee2e6;
             vertical-align: top;
             white-space: nowrap;
         }

         .pt-port-num {
             font-family: 'Cascadia Code','Fira Code',monospace;
             font-weight: 700;
             color: #f8f9fa;
             font-size: 13px;
         }

         .pt-proto-badge {
             display: inline-block;
             border-radius: 3px;
             padding: 0 4px;
             font-size: 13px;
             font-weight: 600;
         }

         .pt-state-open     { font-weight: 700; }
         .pt-state-closed   { color: #eb5757; font-weight: 700; }
         .pt-state-filtered { color: #f0b429; font-weight: 700; }

         /* script rows */
         .port-table tbody tr.pt-script-row td {
             background: #212529;
             border-right: 1px solid #3a4049;
             border-bottom: 1px solid #2c3136;
             white-space: normal;   /* let long script output wrap */
             padding: 0;
         }

         .pt-script-id {
             display: block;
             padding: 5px 8px;
             font-size: 11px;
             font-weight: 700;
             color: #f0b429;
             background: #1a1d21;
             border-right: 1px solid #3a4049;
             white-space: nowrap;
         }

         .pt-script-output {
             display: block;
             padding: 5px 8px;
             font-family: 'Cascadia Code','Fira Code',monospace;
             font-size: 11px;
             color: #ced4da;
             white-space: pre-wrap;
             word-break: break-all;
         }

         
    </style>

                  tr.innerHTML =
                      '<td><span class="pt-port-num">'   + escHtml(port.portid)        + '</span></td>' +
                      '<td><span class="pt-proto-badge">'+ escHtml(port.proto  || '')  + '</span></td>' +
                      '<td><span class="' + stateClass +'">'+ escHtml(port.state || '') + '</span></td>' +
                      '<td>'                             + escHtml(port.service || '') + '</td>'        +
                      '<td>'                             + escHtml(port.product || '') + '</td>'        +
                      '<td>'                             + escHtml(port.version || '') + '</td>';
                  tbody.appendChild(tr);

                  // one row per script
                  (port.scripts_arr || []).forEach(function(s) {
                      var sr = document.createElement('tr');
                      sr.className = 'pt-script-row';
                      sr.innerHTML =
                          '<td colspan="2" style="padding:0;">' +
                              '<span class="pt-script-id">' + escHtml(s.id) + '</span>' +
                          '</td>' +
                          '<td colspan="6" style="padding:0;">' +
                              '<span class="pt-script-output">' + escHtml(s.output || '') + '</span>' +
                          '</td>';
                      tbody.appendChild(sr);
                  });
              });

              table.appendChild(tbody);
              detailBody.appendChild(table);
          }

          function escHtml(str) {
              return String(str)
                  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          }
      })();

      // ══════════════════════════════════════════
      //  SIDEBAR RESIZE
      // ══════════════════════════════════════════
      (function() {
          var resizer = document.getElementById('sidebar-resizer');
          var sidebar = document.getElementById('host-sidebar');
          var wrapper = document.getElementById('page-wrapper');
          var startX, startW;

          resizer.addEventListener('mousedown', function(e) {
              startX = e.clientX;
              startW = sidebar.getBoundingClientRect().width;
              resizer.classList.add('dragging');
              document.body.style.cursor = 'col-resize';
              document.body.style.userSelect = 'none';
              e.preventDefault();
          });

          document.addEventListener('mousemove', function(e) {
              if (!resizer.classList.contains('dragging')) return;
              var dx   = e.clientX - startX;
              var maxW = wrapper.getBoundingClientRect().width * 0.80;
              var newW = Math.min(Math.max(startW + dx, 200), maxW);
              sidebar.style.width    = newW + 'px';
              sidebar.style.minWidth = newW + 'px';
              if (typeof network !== 'undefined' && network) {
                  try { network.redraw(); } catch(err) {}
              }
          });

          document.addEventListener('mouseup', function() {
              if (!resizer.classList.contains('dragging')) return;
              resizer.classList.remove('dragging');
              document.body.style.cursor    = '';
              document.body.style.userSelect = '';
              if (typeof network !== 'undefined' && network) {
                  try { network.fit(); } catch(err) {}
              }
          });
      })();
    </script>
  </body>
</html>
